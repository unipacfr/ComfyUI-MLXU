[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asdx-apple-silicon-diffusion-nodes"
version = "0.2.1"
description = "Custom ComfyUI nodes for Apple Silicon (M1-M5) using MLX native inference with zero-copy unified memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mlx",
    "numpy",
    "torch",
    "safetensors",
    "transformers",
    "Pillow",
]

[tool.setuptools.packages.find]
include = ["apple_silicon_nodes*"]

[tool.comfy]
PublisherId = ""
DisplayName = "ASDX — Apple Silicon Diffusion Nodes"
Icon = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
