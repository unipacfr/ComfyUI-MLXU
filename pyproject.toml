[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asdx-apple-silicon-diffusion-nodes"
version = "0.2.1"
description = "Custom ComfyUI nodes for Apple Silicon (M1-M5) using MLX native inference with zero-copy unified memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mlx",
    "numpy",
    "torch",
    "safetensors",
    "transformers",
    "Pillow",
]

[tool.setuptools.packages.find]
include = ["apple_silicon_nodes*"]

[tool.comfy]
PublisherId = ""
DisplayName = "ASDX — Apple Silicon Diffusion Nodes"
Icon = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Repo root needs to be on sys.path for `tests/` submodules to import each
# other as `tests.support....` (tests/ itself has no __init__.py). This used
# to be done by conftest.py; now that conftest.py is gone (its only other
# job -- hiding the repo-root __init__.py from pytest collection -- was
# retired by making that file's ComfyUI import lazy, see __init__.py),
# pytest's own `pythonpath` option covers this directly.
pythonpath = ["."]
